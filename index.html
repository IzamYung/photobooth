<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Quicksand', sans-serif; }
</style>
<title>📸 Our Photobooth</title>
</head>

<body class="bg-gradient-to-br from-pink-200 via-rose-100 to-pink-200 min-h-screen flex items-center justify-center py-8 px-4">

<div class="bg-white/95 backdrop-blur-sm w-full max-w-3xl p-6 md:p-10 rounded-[2rem] shadow-[0_20px_50px_rgba(225,29,72,0.15)] border-4 border-white flex flex-col items-center gap-8">

<h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-pink-500 text-center drop-shadow-sm">
✨ OUR PHOTOBOOTH ✨
</h1>

<div class="relative w-full max-w-[500px] mx-auto rounded-2xl overflow-hidden shadow-inner border-[6px] border-pink-50 bg-gray-100">
<video 
id="camera" 
class="w-full aspect-[4/3] object-cover -scale-x-100"
autoplay 
playsinline>
</video>

<div id="countdown" class="absolute inset-0 flex items-center justify-center text-7xl md:text-8xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)] pointer-events-none">
</div>
</div>

<button id="capture" class="bg-gradient-to-r from-rose-400 to-pink-500 text-white text-xl font-bold px-12 py-4 rounded-full shadow-lg hover:shadow-[0_10px_20px_rgba(225,29,72,0.3)] hover:-translate-y-1 hover:scale-105 active:scale-95 active:translate-y-0 transition-all duration-300 w-full max-w-[280px]">
📸 Capture!
</button>

<div class="w-full text-center bg-pink-50/60 p-5 rounded-2xl">
<h2 class="font-bold text-gray-700 mb-4 text-lg">✨ Choose Your Vibe ✨</h2>

<div class="flex justify-center gap-3 md:gap-4 flex-wrap">

<label class="cursor-pointer">
<input type="radio" name="filter" value="none" class="peer hidden" checked>
<div class="px-5 py-2.5 flex items-center justify-center rounded-xl border-2 border-transparent bg-white text-gray-600 font-semibold shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200 text-sm md:text-base">
Normal
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="filter" value="grayscale(1)" class="peer hidden">
<div class="px-5 py-2.5 flex items-center justify-center rounded-xl border-2 border-transparent bg-white text-gray-600 font-semibold shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200 text-sm md:text-base">
B&W
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="filter" value="sepia(1)" class="peer hidden">
<div class="px-5 py-2.5 flex items-center justify-center rounded-xl border-2 border-transparent bg-white text-gray-600 font-semibold shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200 text-sm md:text-base">
Vintage
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="filter" value="brightness(1.3)" class="peer hidden">
<div class="px-5 py-2.5 flex items-center justify-center rounded-xl border-2 border-transparent bg-white text-gray-600 font-semibold shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200 text-sm md:text-base">
Bright
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="filter" value="saturate(2)" class="peer hidden">
<div class="px-5 py-2.5 flex items-center justify-center rounded-xl border-2 border-transparent bg-white text-gray-600 font-semibold shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200 text-sm md:text-base">
Color Pop
</div>
</label>

</div>
</div>

<div class="w-full text-center bg-pink-50/60 p-5 rounded-2xl">
<h2 class="font-bold text-gray-700 mb-4 text-lg">🎞️ How Many Snaps? 🎞️</h2>

<div class="flex justify-center gap-3 md:gap-5 flex-wrap">

<label class="cursor-pointer">
<input type="radio" name="photoCount" value="1" class="peer hidden" checked>
<div class="w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl bg-white text-gray-600 font-bold text-lg md:text-xl shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200">
1
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="photoCount" value="2" class="peer hidden">
<div class="w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl bg-white text-gray-600 font-bold text-lg md:text-xl shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200">
2
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="photoCount" value="3" class="peer hidden">
<div class="w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl bg-white text-gray-600 font-bold text-lg md:text-xl shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200">
3
</div>
</label>

<label class="cursor-pointer">
<input type="radio" name="photoCount" value="4" class="peer hidden">
<div class="w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-2xl bg-white text-gray-600 font-bold text-lg md:text-xl shadow-sm peer-checked:bg-rose-400 peer-checked:text-white peer-checked:shadow-md hover:bg-pink-100 transition-all duration-200">
4
</div>
</label>

</div>
</div>

<canvas id="canvas" class="hidden"></canvas>

</div>

<div id="previewModal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity">
<div class="bg-white p-6 md:p-8 rounded-[2rem] flex flex-col items-center gap-6 max-w-md w-full shadow-2xl transform transition-transform scale-100">
<div class="w-full bg-pink-50 p-3 rounded-2xl border-2 border-pink-100">
<img id="previewImage" class="w-full rounded-xl shadow-sm object-contain max-h-[60vh]">
</div>
<div class="flex flex-col sm:flex-row gap-3 w-full">
<button id="downloadPopup" class="flex-1 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold px-6 py-3 rounded-xl hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
⬇️ Download
</button>
<button id="deletePopup" class="flex-1 bg-white border-2 border-gray-200 text-gray-600 font-bold px-6 py-3 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 flex items-center justify-center gap-2">
❌ Delete
</button>
</div>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
