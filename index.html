<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <title>📸 Our Photobooth</title>
</head>

<body class="bg-[radial-gradient(circle_at_top_left,_var(--tw-gradient-stops))] from-pink-100 via-rose-50 to-pink-200 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="bg-white/80 backdrop-blur-xl w-full max-w-4xl p-6 md:p-12 rounded-[3rem] shadow-[0_32px_64px_-12px_rgba(225,29,72,0.2)] border-[8px] border-white flex flex-col items-center gap-10">
        
        <div class="text-center space-y-2">
            <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-pink-500 to-rose-500 tracking-tight drop-shadow-sm">
                OUR PHOTOBOOTH
            </h1>
            <div class="h-1.5 w-24 bg-gradient-to-r from-rose-300 to-pink-400 mx-auto rounded-full opacity-50"></div>
        </div>

        <div class="relative group w-full max-w-[540px] mx-auto">
            <div class="absolute -inset-1 bg-gradient-to-r from-rose-300 to-pink-400 rounded-[2.5rem] blur opacity-25 group-hover:opacity-40 transition duration-1000"></div>
            <div class="relative rounded-[2rem] overflow-hidden shadow-2xl border-[12px] border-white bg-gray-900">
                <video id="camera" class="w-full aspect-[4/3] object-cover -scale-x-100 brightness-[1.05] contrast-[1.05]" autoplay playsinline></video>
                <div id="flashOverlay" class="absolute inset-0 pointer-events-none z-[100]"></div>
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-8xl md:text-9xl font-black text-white drop-shadow-[0_8px_16px_rgba(0,0,0,0.4)] pointer-events-none italic"></div>
                <div class="absolute bottom-4 right-4 flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></div>
                    <div class="w-3 h-3 rounded-full bg-white/50"></div>
                </div>
            </div>
        </div>

        <button id="capture" class="group relative bg-gradient-to-r from-rose-400 to-pink-500 text-white text-2xl font-bold px-16 py-5 rounded-[2rem] shadow-[0_15px_30px_-5px_rgba(225,29,72,0.4)] hover:shadow-[0_20px_40px_-5px_rgba(225,29,72,0.5)] transition-all duration-300 hover:-translate-y-1.5 hover:scale-[1.02] active:scale-95 w-full max-w-[320px] overflow-hidden">
            <span class="relative z-10 flex items-center justify-center gap-3">
                <span class="text-3xl">📸</span> Capture!
            </span>
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        </button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            
            <div class="bg-pink-50/50 p-6 rounded-[2rem] border border-rose-100/50 flex flex-col items-center justify-between gap-4">
                <h2 class="font-bold text-rose-800/70 text-sm uppercase tracking-[0.2em]">⏱️ Set Timer</h2>
                <div class="flex justify-center items-center gap-6 bg-white p-2 rounded-2xl shadow-sm border border-rose-100">
                    <button type="button" onclick="this.parentNode.querySelector('input').stepDown()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white transition-all active:scale-90 font-bold text-2xl">
                        -
                    </button>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <input type="number" name="timer" id="timer" class="w-full bg-transparent text-center text-3xl font-black text-rose-600 focus:outline-none pointer-events-none" value="3" min="1" max="10" readonly>
                        <span class="text-[10px] font-bold text-rose-300 uppercase tracking-widest -mt-1">Secs</span>
                    </div>
                    <button type="button" onclick="this.parentNode.querySelector('input').stepUp()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white transition-all active:scale-90 font-bold text-2xl">
                        +
                    </button>
                </div>
            </div>

            <div class="bg-pink-50/50 p-6 rounded-[2rem] border border-rose-100/50 flex flex-col items-center justify-between gap-4">
                <h2 class="font-bold text-rose-800/70 text-sm uppercase tracking-[0.2em]">🎞️ Photo Count</h2>
                <div class="flex justify-center gap-3 w-full">
                    <label class="flex-1 max-w-[60px]">
                        <input type="radio" name="photoCount" value="1" class="peer hidden" checked>
                        <div class="aspect-square flex items-center justify-center rounded-2xl bg-white text-rose-400 font-bold text-xl shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:bg-rose-400 peer-checked:text-white hover:bg-rose-50 transition-all cursor-pointer">1</div>
                    </label>
                    <label class="flex-1 max-w-[60px]">
                        <input type="radio" name="photoCount" value="2" class="peer hidden">
                        <div class="aspect-square flex items-center justify-center rounded-2xl bg-white text-rose-400 font-bold text-xl shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:bg-rose-400 peer-checked:text-white hover:bg-rose-50 transition-all cursor-pointer">2</div>
                    </label>
                    <label class="flex-1 max-w-[60px]">
                        <input type="radio" name="photoCount" value="3" class="peer hidden">
                        <div class="aspect-square flex items-center justify-center rounded-2xl bg-white text-rose-400 font-bold text-xl shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:bg-rose-400 peer-checked:text-white hover:bg-rose-50 transition-all cursor-pointer">3</div>
                    </label>
                    <label class="flex-1 max-w-[60px]">
                        <input type="radio" name="photoCount" value="4" class="peer hidden">
                        <div class="aspect-square flex items-center justify-center rounded-2xl bg-white text-rose-400 font-bold text-xl shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:bg-rose-400 peer-checked:text-white hover:bg-rose-50 transition-all cursor-pointer">4</div>
                    </label>
                </div>
            </div>

            <div class="md:col-span-2 bg-rose-50/30 p-6 rounded-[2.5rem] border border-rose-100/50 space-y-4">
                <h2 class="font-bold text-rose-800/70 text-center text-sm uppercase tracking-[0.2em]">✨ Select Filter</h2>
                <div class="flex flex-wrap justify-center gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="filter" value="none" class="peer hidden" checked>
                        <div class="px-6 py-3 rounded-2xl bg-white text-gray-500 font-bold shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:text-rose-600 hover:bg-white/80 transition-all text-sm">Normal</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="filter" value="grayscale(1)" class="peer hidden">
                        <div class="px-6 py-3 rounded-2xl bg-white text-gray-500 font-bold shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:text-rose-600 hover:bg-white/80 transition-all text-sm">B&W</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="filter" value="sepia(1)" class="peer hidden">
                        <div class="px-6 py-3 rounded-2xl bg-white text-gray-500 font-bold shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:text-rose-600 hover:bg-white/80 transition-all text-sm">Vintage</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="filter" value="brightness(1.3)" class="peer hidden">
                        <div class="px-6 py-3 rounded-2xl bg-white text-gray-500 font-bold shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:text-rose-600 hover:bg-white/80 transition-all text-sm">Bright</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="filter" value="saturate(2)" class="peer hidden">
                        <div class="px-6 py-3 rounded-2xl bg-white text-gray-500 font-bold shadow-sm border-2 border-transparent peer-checked:border-rose-400 peer-checked:text-rose-600 hover:bg-white/80 transition-all text-sm">Color Pop</div>
                    </label>
                </div>
            </div>
        </div>

        <canvas id="canvas" class="hidden"></canvas>
    </div>

    <div id="previewModal" class="fixed inset-0 bg-rose-950/40 backdrop-blur-md hidden items-center justify-center z-50 p-4 animate-in fade-in duration-300">
        <div class="bg-white p-4 md:p-8 rounded-[3rem] flex flex-col items-center gap-6 max-w-lg w-full shadow-[0_50px_100px_-20px_rgba(0,0,0,0.5)] transform animate-in zoom-in-95 duration-300">
            <div class="w-full bg-rose-50 p-4 rounded-[2rem] border-4 border-rose-100 shadow-inner overflow-hidden">
                <img id="previewImage" class="w-full rounded-2xl shadow-md object-contain max-h-[65vh]">
            </div>
            <div class="flex gap-4 w-full">
                <button id="downloadPopup" class="flex-[2] bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-rose-200 hover:-translate-y-1 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span class="text-xl">⬇️</span> Download
                </button>
                <button id="deletePopup" class="flex-1 bg-white border-2 border-rose-100 text-rose-300 font-bold py-4 rounded-2xl hover:bg-rose-50 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span class="text-xl">❌</span>
                </button>
            </div>
        </div>
    </div>

    <audio src="camera_sound.mp3" id="shutterSound" class="hidden"></audio>

    <script src="script.js"></script>
</body>
</html>
